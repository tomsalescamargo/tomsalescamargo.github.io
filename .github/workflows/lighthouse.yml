name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Performance, accessibility, best practices and SEO budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Run Lighthouse CI (fails below the budgets in lighthouserc.json)
        run: npx --yes @lhci/cli@0.16.1 autorun
